name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test, build and format
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:production-entry
      - run: npm run build
      - run: npm run format:check

  browser:
    name: Browser flow (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 25 }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: general
            scripts: test:flow test:onboarding test:catalog test:expansion test:engine-continuation test:hero-packs
          - group: experience
            scripts: test:experience
          - group: ant-man-wasp
            scripts: test:ant-man test:wasp
          - group: quicksilver-scarlet-witch
            scripts: test:quicksilver test:scarlet-witch
          - group: gmw-heroes
            scripts: test:gmw-heroes
          - group: star-lord-gamora
            scripts: test:star-lord-gamora
          - group: drax-venom
            scripts: test:drax-venom
          - group: mts-heroes
            scripts: test:mts-heroes
          - group: nebula
            scripts: test:nebula
          - group: war-machine
            scripts: test:war-machine
          - group: valkyrie
            scripts: test:valkyrie
          - group: vision
            scripts: test:vision
          - group: sinister-heroes
            scripts: test:sinister-heroes
          - group: nova-ironheart
            scripts: test:nova-ironheart test:milestones
            timeout: 45
          - group: zzzax
            scripts: test:zzzax
          - group: inheritors
            scripts: test:inheritors
          - group: spider-ham
            scripts: test:spider-ham
            timeout: 45
          - group: mutant-genesis
            scripts: test:mutant-genesis
            timeout: 45
          - group: sabretooth
            scripts: test:sabretooth
            timeout: 45
          - group: project-wideawake
            scripts: test:project-wideawake
            timeout: 45
          - group: master-mold
            scripts: test:master-mold
            timeout: 45
          - group: spdr-identity
            scripts: test:spdr
            spdrScenarios: maintenance,pilot-flip,sync-cancel,rapid-deployment,web-trap,venom,systems-ready,systems-search,may-hero,may-alter,command-draw,command-ready,host-ready,psychic-thwart,fluid-attack,alloy-defense,ejection
            timeout: 35
          - group: spdr-player-pool
            scripts: test:spdr
            spdrScenarios: pool-daredevil,pool-noir,pool-repurpose,pool-thwip,pool-barrier,pool-forcefield,pool-tingle-treachery,pool-tingle-minion,pool-ham,pool-spider-man,pool-stamina,pool-unshakable,pool-clarity
            spdrFixtureOnly: "1"
            timeout: 35
          - group: spdr-nemesis-sinister
            scripts: test:spdr
            spdrScenarios: obligation-remove,obligation-discard,nemesis,giant-cost,morbius-sync,drain-energy,drain-damage,drain-alter,module-grand,module-bombshell,module-bombshell-remainder,module-bombshell-boost,module-electro,module-hobgoblin,module-iron-spider,module-iron-spider-overkill,module-sandman,module-sandman-boost,module-spot-exact,module-spot-excess,module-spot-boost,module-surge,module-surge-remove
            spdrFixtureOnly: "1"
            timeout: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the development server
        run: |
          ACCOUNTS_DB_PATH=.accounts/ci.sqlite npm run dev -- --host 127.0.0.1 > output-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5174 > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Dev server did not start"; cat output-dev.log; exit 1
      - name: Build and serve production artifact
        if: matrix.group == 'mutant-genesis' || matrix.group == 'sabretooth' || matrix.group == 'project-wideawake' || matrix.group == 'master-mold'
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > output-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173 > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Production preview did not start"; cat output-preview.log; exit 1
      - name: Verify ${{ matrix.group }}
        run: |
          for script in $CI_BROWSER_SCRIPTS; do
            npm run "$script"
          done
        env:
          BASE_URL: ${{ (matrix.group == 'mutant-genesis' || matrix.group == 'sabretooth' || matrix.group == 'project-wideawake' || matrix.group == 'master-mold') && 'http://127.0.0.1:4173' || 'http://127.0.0.1:5174' }}
          CI_BROWSER_SCRIPTS: ${{ matrix.scripts }}
          SPDR_SCENARIOS: ${{ matrix.spdrScenarios }}
          SPDR_FIXTURE_ONLY: ${{ matrix.spdrFixtureOnly }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-output-${{ matrix.group }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: ignore
